#:schema node_modules/wrangler/config-schema.json
name = "darayi"
main = "dist/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/index.html", "/sw.js", "/api/*", "/v1/*"]

[[d1_databases]]
binding = "DB"
database_name = "darayi-db"
database_id = "d899a07a-a59f-4cf0-aa83-b14d67e02e8f"

[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

[vars]
APP_URL = "https://darayi.clearworks.workers.dev"
GOOGLE_CLIENT_ID = "927651692028-q4rp0ir4lcgg94pc9r76rcu6t0veoele.apps.googleusercontent.com"
INLINE_REFRESH_S = "60"
PRICE_HISTORY_DAYS = "7"

# اتصال Cloudflare KV برای ذخیره Snapshot آخرین قیمت‌های معتبر بازار (کلید prices:snapshot:v1)
[[kv_namespaces]]
binding = "PRICES_KV"
id = "f3f8411932bf4d97a753578ef147a00d"

# Cloudflare Observability (لاگ‌ها، ردیابی خطاها و رهگیری عملکرد)
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
